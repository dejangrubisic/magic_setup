[project]
name = "magic"
version = "0.1.0"
description = "Fast-start scaffold for time-limited ML evaluation / curriculum / data-analysis tasks."
readme = "README.md"
authors = [{ name = "Dejan Grubisic", email = "grubisic.dejan@yahoo.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "datasets>=3.0",
    "anthropic>=0.40",
    "pydantic>=2.8",
    "tqdm>=4.66",
    "diskcache>=5.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
