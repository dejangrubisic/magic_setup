[project]
name = "magic"
version = "0.1.0"
description = "Fast-start scaffold for time-limited ML evaluation / curriculum / data-analysis tasks."
readme = "README.md"
authors = [{ name = "Dejan Grubisic", email = "grubisic.dejan@yahoo.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "datasets>=3.0",
    "anthropic>=0.40",
    "pydantic>=2.8",
    "tqdm>=4.66",
    "diskcache>=5.6",
    "tabulate>=0.9",
]

# Optional, pre-resolved so `uv sync --extra torch` is one command; CPU wheels on Linux (CI) to
# avoid multi-GB CUDA downloads. Keep tests on CPU/float32 so macOS (MPS) and ubuntu agree.
[project.optional-dependencies]
torch = ["torch>=2.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false          # plain environment: src/ holds modules, nothing is built or installed

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pytest>=9.1",
    "pytest-xdist>=3.6",
    "pre-commit>=4.0",
]

["uv_build>=0.11.30,<0.12.0"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data", "runs", ".claude/worktrees"]

[tool.ruff.lint]
# Explicit `select` (not extend-select): ruff 0.16 expanded its defaults from 59 to 413 rules,
# so an explicit list keeps upgrades from silently changing what CI enforces.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length: the formatter owns it
    "E731",     # lambda assignment is fine in research code
    "E741",     # short math names (l, I, O)
    "B905",     # zip(strict=) noise
    "RUF012",   # mutable class attrs in configs
    "SIM108",   # ternary-vs-if is taste
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# ---------------------------------------------------------------- pytest
[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
strict = true
addopts = ["--tb=short", "--import-mode=importlib", "-ra"]
