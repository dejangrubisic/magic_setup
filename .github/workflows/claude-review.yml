# The CI agent. Reviews every PR against its linked issue using the same procedure humans and
# local agents use (.claude/skills/review-pr/SKILL.md), then the job passes only on APPROVE.
# Job name `review` is a required status check. Fails closed: no verdict => red.
#
# Auth: set ONE repo secret -> CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, subscription
# billing) or ANTHROPIC_API_KEY (API billing). Both inputs are passed; the empty one is ignored.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Neutral skip (not a red run) for drafts and bot-initiated pushes.
    if: github.event.pull_request.draft == false && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write   # gh pr comment + inline comments
      issues: read           # gh issue view
      id-token: write        # required: OIDC exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12", enable-cache: true }
      - run: uv sync --locked

      # The action refuses to run unless this workflow file is identical to main, so a PR that edits
      # it can never get a verdict: skip the agent, pass with a warning, and CODEOWNERS makes a human
      # approval mandatory for .github/ changes.
      - id: wf
        run: |
          if git diff --quiet origin/main -- .github/workflows/claude-review.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::claude-review.yml differs from main; agent review skipped, a human must review this PR"
          fi

      - id: review
        if: steps.wf.outputs.changed == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the CI reviewer. Read .claude/skills/review-pr/SKILL.md and follow its procedure
            exactly for PR ${{ github.event.pull_request.number }}. The PR branch is checked out and
            the environment is synced (`make test` / `make lint` work). `gh` is authenticated.
            Post inline comments for concrete defects and ONE summary comment whose first line is
            "VERDICT: APPROVE" or "VERDICT: REQUEST_CHANGES". Never write the text "@claude".
            Finally return the JSON described by the schema.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(make test),Bash(make lint),Bash(uv run pytest:*),Bash(scripts/tests_on_base.sh:*),Bash(./scripts/tests_on_base.sh:*),Bash(bash scripts/tests_on_base.sh:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "WebSearch,WebFetch,Edit,Write,MultiEdit"
            --json-schema '{"type":"object","required":["verdict","obligations","blocking"],"properties":{"verdict":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"obligations":{"type":"array","items":{"type":"object","required":["text","status","evidence"],"properties":{"text":{"type":"string"},"status":{"type":"string","enum":["met","unmet","unverifiable"]},"evidence":{"type":"string"}}}},"blocking":{"type":"array","items":{"type":"string"}},"notes":{"type":"array","items":{"type":"string"}}}}'

      - name: Gate on verdict (this job is the red/green check)
        if: always()
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ "${{ steps.wf.outputs.changed }}" = "true" ]; then echo "review skipped: workflow changed, human review required"; exit 0; fi
          if [ -z "$OUT" ] || ! printf '%s' "$OUT" | jq -e . >/dev/null; then
            echo "::error::No structured verdict: the action did not run to completion (GitHub App not installed, secret missing, max-turns hit). Failing closed."; exit 1
          fi
          printf '%s' "$OUT" | jq .
          verdict=$(printf '%s' "$OUT" | jq -r .verdict)
          echo "verdict=$verdict"
          [ "$verdict" = "APPROVE" ] || { echo "::error::Reviewer requested changes:"; printf '%s' "$OUT" | jq -r '.blocking[]' ; exit 1; }
