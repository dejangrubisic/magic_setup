name: Task
description: One unit of work, closed by exactly one PR.
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What and why, in one paragraph. Name the metric or artifact that shows it is done.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Each line observable and pass/fail. Prefer a command or a test name.
      value: |
        - [ ] `uv run pytest tests/test_<x>.py::test_<y>` passes and asserts <specific behavior>
        - [ ] `make lint && make test` pass
    validations: { required: true }
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: The reviewer blocks anything listed here or not asked for above.
  - type: textarea
    id: files
    attributes:
      label: Files expected to change
      description: Keep disjoint from other issues being worked in parallel. New behavior goes in new files.
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must be merged first (e.g. "#3, #4"), or "none".
